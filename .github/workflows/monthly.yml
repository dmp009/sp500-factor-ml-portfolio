name: monthly
on:
  schedule:
    - cron: "0 13 1-3 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to run (YYYY-MM). Empty means the last closed month."
        required: false
permissions:
  contents: write
  issues: write
concurrency:
  group: monthly
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Refresh
        env:
          MONTH: ${{ inputs.month }}
        run: python -m factorml.pipeline monthly ${MONTH:+--month "$MONTH"}
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot reports
          if git diff --cached --quiet; then echo "Nothing new to commit"; else git commit -m "data: monthly refresh" && git push; fi
      - name: Close open alerts
        run: |
          for n in $(gh issue list --label refresh-failed --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Run $RUN_URL succeeded."
          done
      - name: Open or update alert
        if: failure()
        run: |
          python -m factorml.alert --run-url "$RUN_URL" || { mkdir -p data/raw; echo "Monthly refresh failed" > data/raw/alert_title.txt; echo "The job failed before the pipeline could report. Run log: $RUN_URL" > data/raw/alert_body.md; }
          gh label create refresh-failed --color B60205 --description "Monthly refresh failed" 2>/dev/null || true
          n=$(gh issue list --label refresh-failed --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file data/raw/alert_body.md
          else
            gh issue create --title "$(cat data/raw/alert_title.txt)" --body-file data/raw/alert_body.md --label refresh-failed
          fi
