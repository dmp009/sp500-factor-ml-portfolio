# LightGBM hyper-parameters. Chosen once by factorml.model.tune on months up to 2012-12
# (mean validation IC -0.0313) and frozen for the backtest and the live runs.
params:
  n_estimators: 300
  learning_rate: 0.03
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  random_state: 0
  verbose: -1
  num_leaves: 31
  min_child_samples: 100
